id = "hs.jail"
name = "Herdr Jail"
version = "0.1.0"
# PROVISIONAL: 0.7.6 is the planned first resource-capable release. Confirm it
# contains Workspace Resources before publishing this plugin version.
min_herdr_version = "0.7.6"
description = "Run coding agents inside yolo-jail sandboxes: reuse a parent Checkout's jail, enforce jailing for supported agents, and visualize running jails per Checkout."
platforms = ["macos", "linux"]

# Report structured, transient Jail Workspace Resources below their Checkouts.
# No custom sidebar row/token configuration is required.
[[startup]]
command = ["bash", "bin/jails-refresher.sh"]

# --- Feature #2 (sanctioned entry) + #1 (parent-jail reuse) ---
# Launch the Checkout's agent inside a jail. Wraps the agent in `yolo --`,
# and if an ancestor directory already has a running jail in the SAME Herdr
# Checkout, prompts to reuse it instead of spawning a new one.
[[actions]]
id = "run"
title = "Run agent in jail"
description = "Launch a supported coding agent inside a yolo-jail (reusing a parent jail if one exists)."
contexts = ["pane", "workspace"]
command = ["bash", "bin/jail-run.sh"]

# --- Manual migrate/handoff (recovery, not prevention) ---
# Deliberately invoked: stop an un-jailed agent in the pane and relaunch it
# jailed with session resume (claude: --continue). Never fired automatically.
[[actions]]
id = "migrate"
title = "Migrate agent into jail"
description = "Stop an un-jailed agent in this pane and relaunch it jailed, resuming the session where possible."
contexts = ["pane"]
command = ["bash", "bin/migrate.sh"]

# --- Feature #2 (enforcement watchdog) ---
# When Herdr detects a supported agent running OUTSIDE a jail, flag it.
[[events]]
on = "pane.agent_detected"
command = ["bash", "bin/enforce.sh"]

# --- Feature #3 (supplementary Jail Tree overview) ---
# Workspace Resources render actionable jail children beneath Checkouts in
# Spaces. This plugin-owned pane remains a separate overview grouped by Herdr
# Checkouts.
[[panes]]
id = "tree"
title = "Jail Tree"
placement = "split"
command = ["bash", "bin/jail-tree.sh"]

[[actions]]
id = "open-tree"
title = "Open Jail Tree"
description = "Show running yolo-jails grouped by Herdr Checkouts."
contexts = ["workspace", "pane"]
command = ["bash", "bin/open-tree.sh"]

# --- Checkout aggregate and exact Workspace Resource jail actions ---
# Herdr resolves one native choice per live Open/Close operation. The normal
# action remains callable and opens the overlay picker when no choice is set.
[[actions]]
id = "jails"
title = "Jails…"
description = "Open or close the yolo-jails attached to this Checkout."
contexts = ["workspace", "workspace_resource"]
command = ["bash", "bin/jail-menu.sh"]
choices_command = ["bash", "bin/jail-menu-provider.sh"]

[[panes]]
id = "jail-menu"
title = "Jails"
placement = "overlay"
command = ["bash", "bin/jail-menu-ui.sh"]
